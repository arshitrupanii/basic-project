<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <header>
      <nav class="container">
        <a href="#" class="nav-logo">
          <h2 class="logo-text">☕ Coffee</h2>
        </a>

        <ul class="nav-menu">
          <li class="nav-item">
            <a href="#" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">About</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Menu</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Testimonial</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Gallery</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- HERO SECTION -->
      <section class="hero-section">
        <div class="section-content container">
          <div class="hero-details">
            <h2 class="title">Best Coffee</h2>
            <h3 class="subtitle">Make your day great with out special coffee!</h3>
            <p class="description">
              Welcome to out coffee paradise, where every bean tells a story and every cup sparks joy.
            </p>
            <div class="buttons">
              <a href="#" class="order-now button">Order now</a>
              <a href="#" class="contact-us button">Contact us</a>
            </div>
          </div>

          <div class="hero-image-wrapper">
            <img class="hero-image" src="images/coffee-hero-section.png" alt="Coffee image" >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
