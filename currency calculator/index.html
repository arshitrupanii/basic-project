<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor - Arshit rupani</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/366351d6ff.js" crossorigin="anonymous"></script>
</head>

<body>
    <main>
        <div>
            <h2>Currency convertor</h2>
        </div>

        <div>
            <p>Enter the number : </p>
            <input type="number" id="amount" name="amount">
        </div>

        <div class="dropdown">
            <div class="from">
                <p>From</p>
                <div>
                    <img class="flag" src="https://flagsapi.com/US/flat/64.png" alt="">
                    <select name="currency" class="currOption"></select>
                </div>
            </div>

            <i class="fa-solid fa-arrow-right-arrow-left"></i>

            <div class="to">
                <p>To</p>
                <div>
                    <img class="flag" src="https://flagsapi.com/IN/flat/64.png" alt="">
                    <select name="currency" class="currOption"></select>
                </div>
            </div>
        </div>

        <div class="exchange">
            1 USD = 80 INR
        </div>

        <div>
            <button id="submit-btn" type="submit">Get exchange</button>
        </div>

    </main>

    <script src="codes.js"></script>
    <script src="script.js"></script>

</body>

</html>
