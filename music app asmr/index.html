<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <img class="background-image" src="assets/1.jpg" alt="">
    </div>

    <div class="main">
        <div class="card">

            <div class="image">
                <img class="cover-image" src="assets/1.jpg" alt="">
            </div>

            <div class="song-name">The Charmer's Call</div>
            <div class="artist-name">Hanu Dixit</div>

            <div class="song-duration">
                <span class="current-time">0:00</span>
                <span class="duration">0:00</span>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <div class="buttons">
                <i class="fa-solid fa-backward" id="prev"></i>
                <i class="fa-solid fa-play" id="play-btn"></i>
                <i class="fa-solid fa-forward" id="next"></i>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
